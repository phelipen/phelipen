<title id="scene-title">Código e café</title><desc id="scene-desc">Robozinho em pixel art digitando no computador ao lado de uma xícara com vapor animado.</desc>
<style>
.eye { animation: blink 5s steps(1,end) infinite; transform-box:fill-box; transform-origin:center; }
