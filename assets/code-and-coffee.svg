@keyframes type { 0%,100% { transform:translateY(0); } 50% { transform:translateY(2px); } }
@keyframes cursor { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
@media(prefers-reduced-motion:reduce) { .eye,.hand,.cursor { animation:none; } }
</style>
